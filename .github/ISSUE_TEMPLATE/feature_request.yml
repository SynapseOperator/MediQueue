name: 改进建议
description: 提出具体使用场景、建议与验证方式。
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        当前业务基线以 docs/spec 中的 V1.1 文档为准。
        请说明建议是否影响现有业务规则、数据模型或兼容性。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体使用场景或已有不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为与验收方式
      description: 说明期望结果、相关规格条目及如何验证。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与替代方案
      description: 说明对现有业务规则的影响，以及更简单的替代方案。
    validations:
      required: true
