name: 改进建议
description: 提出具体问题与建议；冻结业务规则变更需负责人确认。
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        当前业务基线以 docs/spec 中的 V1.1 文档为准。
        提交建议不等于批准扩展范围；请说明是否影响已冻结规则或阶段验收。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体使用场景或已有不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为与验收方式
      description: 说明期望结果、相关规格条目及如何验证。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与替代方案
      description: 说明是否改变冻结业务规则、涉及哪个阶段，以及更简单的替代方案。
    validations:
      required: true
