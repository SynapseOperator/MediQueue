name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata and lock file
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: php scripts/check-php-syntax.php
      - name: Check PHP style
        run: php vendor/bin/pint --test
      - name: Audit PHP dependencies
        run: composer audit

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This public value is only for the disposable CI service, never a deployment.
      MYSQL_ROOT_PASSWORD: mediqueue-ci-only
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mediqueue-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pmediqueue-ci-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and build assets
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
      - name: Generate isolated application and database environments
        run: |
          php scripts/setup-local.php
          sed -i 's/^DB_PORT=3307$/DB_PORT=3306/' .env .env.testing .env.migration
          set -a
          source .env.database
          set +a
          export MYSQL_HOST=127.0.0.1 MYSQL_PORT=3306
          bash docker/mysql/init.sh
      - name: Migrate with the dedicated schema account
        run: php artisan migrate --env=migration --force
      - name: Seed synthetic demo data with the runtime account
        run: php artisan db:seed --force
      - name: Verify test database migration and rollback
        run: |
          php artisan migrate --env=testing --force
          php artisan migrate:rollback --env=testing --force
          php artisan migrate --env=testing --force
      - name: Run tests against real MySQL
        run: php artisan test --log-junit test-results/junit.xml
      - name: Verify application caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-junit
          path: |
            test-results/junit.xml
            test-results/appointment-concurrency-*.json
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --output gitleaks_8.30.1_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output gitleaks_8.30.1_checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan all Git history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --log-opts="--all" .'
