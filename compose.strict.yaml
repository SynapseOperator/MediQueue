services:
    mysql:
        image: mysql:8.4
        ports:
            - "127.0.0.1:3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run php scripts/setup-local.php first}
            MEDIQUEUE_APP_PASSWORD: ${MEDIQUEUE_APP_PASSWORD:?Missing generated app password}
            MEDIQUEUE_MIGRATOR_PASSWORD: ${MEDIQUEUE_MIGRATOR_PASSWORD:?Missing generated migration password}
            MEDIQUEUE_TEST_PASSWORD: ${MEDIQUEUE_TEST_PASSWORD:?Missing generated test password}
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/10-mediqueue.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    mysql-data:
        name: mediqueue-mysql-data
